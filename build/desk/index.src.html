async function dbRetry(fn){
  for(var i=0;;i++){
    try{return await fn()}
    catch(e){var c=e&&e.code;if((c==='unavailable'||c==='resource_exhausted')&&i<5){await sleep(500*Math.pow(2,i)+Math.random()*300);continue}throw e}
  }
}
function dset(path,data){return dbRetry(function(){return S.db.doc(path).set(data)})}
function ddel(path){return dbRetry(function(){return S.db.doc(path).delete()})}

var AUD={};
function whoAmI(){var v=S.viewer;if(!v)return 'unknown';if(v.email)return v.email;if(v.id)return 'uid:'+v.id;if(v.owner)return 'owner';return 'unknown'}
/* real SAP data present: any non-demo upload, or any plant-month cell not flagged demo */
function hasRealData(){
  if(S.uploads.some(function(u){return !u.demo}))return true;
  for(var k in S.cells){var pl=(S.cells[k]&&S.cells[k].plants)||{};for(var p in pl){if(!pl[p].demo)return true}}
  return false;
}

async function auditW(ev,q,extra){
  var id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  var doc=Object.assign({at:nowISO(),by:whoAmI(),event:ev,q:q||''},extra||{});AUD[id]=doc;await dset('audit/'+id,doc);return id;
}

/* snapshot data arrives frozen: copy before adding _id or mutating */
function thaw(v){try{return typeof structuredClone==='function'?structuredClone(v):JSON.parse(JSON.stringify(v))}catch(e){return JSON.parse(JSON.stringify(v))}}
function dataOf(snap){return snap.docs.map(function(d){var x=thaw(d.data()||{});x._id=d.id;return x})}
function subscribe(name,q,assign){
  q.onSnapshot(function(snap){try{assign(dataOf(snap))}catch(e){S.errs[name]='could not decode ('+((e&&e.message)||e)+')';S.err=(S.err||'')+'Could not read '+name+': '+S.errs[name]+' ';schedule();return}S.loaded[name]=true;delete S.errs[name];schedule()},function(e){var c=(e&&e.code)||(e&&e.message)||'error';S.errs[name]=c;S.err=(S.err||'')+'Could not read '+name+': '+c+' ';schedule()});
}
function dbErrText(e){
  if(e&&e.code==='quota_exceeded')return 'The shared database is full ('+(e.message||'quota')+'). Nothing more can be stored. Tell the Delivery Lead.';
  return (e&&e.message)||String(e);
}

function viewerUser(){
  var em=(S.viewer&&S.viewer.email||'').toLowerCase(),id=S.viewer&&S.viewer.id;
  return S.users.find(function(x){return em&&x.email===em})||S.users.find(function(x){return id&&x.uid&&x.uid===id})||null;
}
function viewerRole(){
  var em=(S.viewer&&S.viewer.email||'').toLowerCase();
  var u=viewerUser();
  if(u&&!em&&S.viewer)S.viewer.email=u.email;
  if(!em&&!u)return S.viewer&&S.viewer.owner?'Super admin':null;
  if(!em)em=u.email;
  if(u&&u.active===false)return 'inactive';
  if(SEED_SUPER.indexOf(em)>=0)return 'Super admin';
  if(u)return u.role;
  return null;
}

/* ================= coverage ================= */
function entityCells(ent){var o={};Object.keys(S.cells).forEach(function(k){var c=S.cells[k];if(c.entity===ent)o[c.ym]=c});return o}
function cellPlants(c){return c?Object.keys(c.plants||{}).length:0}
function covStatus(ent,qkey){
  if(ent==='ST')return stockCov(qkey);
  var cs=entityCells(ent),ref=0;Object.keys(cs).forEach(function(ym){ref=Math.max(ref,cellPlants(cs[ym]))});
  var months=qMonths(qkey),present=0,ok=0,detail=[];
  months.forEach(function(ym){var n=cellPlants(cs[ym]);detail.push({ym:ym,plants:n});if(n>0)present++;if(n>0&&n>=Math.ceil(ref*0.9))ok++});
  var st=present===0?'miss':(ok===3?'ok':'part');
  return{st:st,detail:detail,ref:ref,closed:!!(S.periods[qkey]&&S.periods[qkey].status==='closed')};
}
function storageStats(){
  var docs=0,bytes=0,rows=0;
  Object.keys(S.cells).forEach(function(k){var c=S.cells[k];Object.keys(c.plants||{}).forEach(function(p){var x=c.plants[p];docs+=x.chunks||0;bytes+=x.bytes||0;rows+=x.lines||0})});
  return{docs:docs,bytes:bytes,lines:rows};
}

function headerIndex(headers){var m={};headers.forEach(function(h,i){var k=norm(h);if(k!==''&&!(k in m))m[k]=i});return m}
function detect(headers){
  var ix=headerIndex(headers),has=function(n){return norm(n) in ix};
  if(has('docnum')&&has('cardcode')&&has('bplname'))return{type:'invoice',sys:'B1'};
  if(has('invoice document number')&&has('plant')&&has('invoice date'))return{type:'invoice',sys:'S4'};
  var set={};headers.forEach(function(h){set[norm(h)]=1});
  if(set['email']&&set['role']&&set['today_cap'])return{type:'master',what:'users'};
  if(set['plant_code']&&set['plant_name']&&set['plant_type'])return{type:'master',what:'plants'};
  if(set['potential_value_inr']&&set['fy_quarter'])return{type:'master',what:'potential'};
  if(set['cardcode']&&set['tranfser'])return{type:'master',what:'transfers'};
  if(set['phasing_pct'])return{type:'master',what:'phasing'};
  if(set['item no.']&&set['item category'])return{type:'master',what:'items'};
  if(set['employee code']&&set['fullname'])return{type:'master',what:'semp'};
  return{type:'unknown'};
}
function defaultMap(headers,sys){
  var ix=headerIndex(headers),map={};
  INV.fields.forEach(function(f){var c=(sys==='B1'?f.b1:f.s4)||[];for(var i=0;i<c.length;i++){var k=norm(c[i]);if(k in ix){map[f.k]=ix[k];return}}map[f.k]=-1});
  return map;
}

async function onFile(file){
  if(!U||U.stage==='validating'||U.stage==='loading')return;
  var mode=U.mode,period=U.period,ent=U.entity;
  U=newU();U.mode=mode;U.period=period;U.entity=ent;U.stage='parsing';U.msg='Reading '+file.name+' ('+fmtBytes(file.size)+'). Large XLSX files can take a minute.';U.name=file.name;U.size=file.size;
  renderUpload();await tick();
  var sheetsSeen0=null;
  try{
    var rows;
    if(/\.(xlsx|xls)$/i.test(file.name)){
      if(typeof XLSX==='undefined')throw new Error('The spreadsheet reader did not load. Check the connection, or save the file as CSV.');
      var buf=await file.arrayBuffer();await tick();
      var names=XLSX.read(buf,{type:'array',bookSheets:true}).SheetNames||[];
      var heads={};try{var wh=XLSX.read(buf,{type:'array',sheetRows:2,dense:true});names.forEach(function(n){var rr=XLSX.utils.sheet_to_json(wh.Sheets[n]||{},{header:1,raw:true,defval:'',blankrows:false});heads[n]=(rr[0]||[]).map(function(x){return x==null?'':String(x)})})}catch(e){}

      var pick=names.find(function(n){return /^(data|sapui5 export)$/i.test(n)&&kindOf(n).type==='invoice'})||names.find(function(n){return heads[n]&&heads[n].length&&stockDetect(heads[n])})||names.find(function(n){return kindOf(n).type==='invoice'})||names.find(function(n){return /^(data|sapui5 export)$/i.test(n)})||names.find(function(n){return heads[n]&&heads[n].length&&!/^filter$/i.test(n)})||names.find(function(n){return !/^filter$/i.test(n)})||names[0];
      U.sheetPicked=pick;U.sheetsSeen=names.map(function(n){var k=kindOf(n);return n+' ('+(k.type==='invoice'?'invoice export':k.type==='master'?k.what+' list':k.type==='empty'?'empty':(heads[n]||[]).slice(0,4).join(', ')+(heads[n]&&heads[n].length>4?'...':''))+')'});
      sheetsSeen0=U.sheetsSeen;U.msg='Parsing sheet "'+pick+'"...';renderUpload();await tick();
      var wb=XLSX.read(buf,{type:'array',sheets:pick,dense:true,cellDates:false,cellNF:false,cellStyles:false,cellFormula:false,cellHTML:false});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[pick],{header:1,raw:true,defval:'',blankrows:false});
    }else{
      var txt=await file.text();await tick();rows=parseCSV(txt);
    }
    if(!rows.length){U=newU();U.mode=mode;U.period=period;U.msg='The sheet is empty'+(U.sheetsSeen?'':'')+'. Expected the B1 Combine Sale export (sheet DATA: docnum, CardCode, BPLName ...) or the S/4 Sales Register (sheet SAPUI5 Export: Invoice Document Number, Plant, Invoice Date ...).'+(sheetsSeen0&&sheetsSeen0.length?' Sheets in the workbook: '+sheetsSeen0.join('; ')+'.':'');renderUpload();return}
    var headers=rows[0].map(function(x){return x==null?'':String(x)});
    var d=detect(headers);
    var sheetsSeen=U.sheetsSeen,sheetPicked=U.sheetPicked;
    if(d.type==='unknown'){var sdt=stockDetect(headers);if(sdt){stockStart(file,rows,headers,sdt,sheetPicked);return}}
    if(d.type==='master'&&d.what==='transfers'){U=newU();U.mode=mode;U.period=period;U.offer={file:file,rows:rows,what:'transfers'};U.msg='This file is the internal-transfer list (CardCode, CardName, Tranfser), not the sales export'+(sheetsSeen&&sheetsSeen.length>1?'. Sheets in the workbook: '+sheetsSeen.join('; ')+'. Save the DATA sheet as the CSV, or load the whole XLSX':'')+'. You can load it as the Internal-transfer list instead.';renderUpload();return}
    if(d.type==='master'){U=newU();U.mode=mode;U.period=period;U.msg='This is a '+d.what+' template, not a SAP export. Load it from Admin ('+({users:'Users',plants:'Plants',potential:'Market potential',phasing:'Market potential, Upload phasing',transfers:'Internal transfer',items:'Item master',semp:'Sales employees'})[d.what]+').';renderUpload();return}
    if(d.type==='unknown'){U=newU();U.mode=mode;U.period=period;U.msg='The headers match no known file'+(rows.length<2?' (the sheet has no data rows)':'')+'. Found: '+(headers.filter(Boolean).slice(0,8).join(', ')||'no header row')+(sheetsSeen&&sheetsSeen.length?'. Sheets in the workbook: '+sheetsSeen.join('; '):'')+'. Expected the B1 Combine Sale export (sheet DATA: docnum, CardCode, BPLName ...) or the S/4 Sales Register (sheet SAPUI5 Export: Invoice Document Number, Plant, Invoice Date ...). For a master, use Admin.';renderUpload();return}

    U.stage='mapping';U.msg='';
  }catch(e){U=newU();U.mode=mode;U.period=period;U.msg='Could not read the file: '+((e&&e.message)||e)}

function serialToYMD(n){var d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
function parseDateCell(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){if(v>20000&&v<80000){var t=serialToYMD(v);t.kind='serial';return t}return null}
  if(v instanceof Date){return{y:v.getFullYear(),m:v.getMonth()+1,d:v.getDate(),kind:'serial'}}
  var s=String(v).trim(),m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return{y:+m[1],m:+m[2],d:+m[3],kind:'iso'};
  if((m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(s)))return{y:+m[3],m:+m[2],d:+m[1],kind:'text'};
  if(/^\d{5}(\.\d+)?$/.test(s)){var n=+s;if(n>20000&&n<80000){var t2=serialToYMD(n);t2.kind='serial';return t2}}
  return null;
}
function validYMD(t){if(!t||t.m<1||t.m>12||t.d<1||t.d>31||t.y<1990||t.y>2100)return false;return t.d<=new Date(Date.UTC(t.y,t.m,0)).getUTCDate()}

async function demoClear(){
  if(effRole()!=='Super admin'||readOnly()){toast('Only a Super admin can clear demo data');return}
  toast('Clearing demo data...');
  try{
    var cellIds=Object.keys(S.cells);
    for(var i=0;i<cellIds.length;i++){
      var c=JSON.parse(JSON.stringify(S.cells[cellIds[i]])),ch=false;
      for(var p in c.plants){var x=c.plants[p];if(x.demo){for(var k=0;k<x.chunks;k++)await ddel('inv/'+x.sys+'-'+p+'-'+c.ym+'-'+k);delete c.plants[p];ch=true}}
      if(ch){if(Object.keys(c.plants).length){await dset('cells/'+cellIds[i],c);S.cells[cellIds[i]]=c}else{await ddel('cells/'+cellIds[i]);delete S.cells[cellIds[i]]}}
    }
    for(var u of S.uploads.filter(function(x){return x.demo})){await ddel('uploads/'+u._id);await ddel('rejects/'+u._id)}
    for(var q in S.periods){if(S.periods[q].demo)await ddel('periods/'+q)}
    for(var pt of S.plants.filter(function(x){return x.demo})){if(pt.demoDefault)await dset('plants/'+pt.plant_code,{plant_code:pt.plant_code,plant_name:'',plant_type:pt.plant_type||'Depot',zone:'',state:'',b1_bpl_name:'',business:'laminates',active:true,seed:true});else await dset('plants/'+pt.plant_code,Object.assign({},pt,{demo:undefined,plant_name:pt.plant_name,b1_bpl_name:pt.b1_bpl_name}))}
    for(var po of S.potential.filter(function(x){return x.demo}))await ddel('potential/'+po._id);

}

  if(!u.name)errs.push('Name is required');
  if(ROLES.indexOf(u.role)<0)errs.push('Role is not one of the 8 roles');
  if(!u.department)errs.push('Department is required');
  if(u.plant_codes){u.plant_codes.split(';').forEach(function(c){c=c.trim();if(c&&!S.plants.some(function(p){return p.plant_code===c}))errs.push('Plant code '+c+' is not in the plant master')})}

document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.matches&&t.matches('input[type=file]')){var f=t.files&&t.files[0];if(!f)return;if(t.id==='u-file')onFile(f);else if(t.getAttribute('data-file'))masterUpload(t.getAttribute('data-file'),f).then(function(){t.value=''});return}
  var c=t.getAttribute&&t.getAttribute('data-chg');if(!c)return;
  if(c==='u-mode'){U.mode=t.value;if(U.mode==='daily'&&U.period==='auto')U.period=gridQuarters().cur;renderUpload()}
  else if(c==='u-period'){U.period=t.value}
  else if(c==='u-ent'){U.entity=t.value}
  else if(c==='map'){U.map[t.getAttribute('data-k')]=+t.value;U.savedMap=false;renderUpload()}

  else if(c==='anyway'){U.anyway=t.checked;renderUpload()}
  else if(c==='confrep'){U.confirmReplace=t.checked;renderUpload()}
  else if(c==='closeafter'){U.closeAfter=t.checked}
  else if(c==='keepdocs'){U.keepDocs=t.checked}
  else if(c==='rejf'){U.rejFilter=t.value;renderUpload()}
  else if(c==='hist-f'){S.hist[t.getAttribute('data-k')]=t.value;S.hist.shown=15;renderHist()}
  else if(c==='potf'){var k=t.getAttribute('data-k');S.potFilter[{'pf-q':'q','pf-plant':'plant','pf-group':'group','pf-seg':'seg'}[k]]=t.value;refreshAdmin()}
});

});

/* ================= boot ================= */
/* every viewer or capability await gets a timeout and a fallback, so the opening gate can never hang */
function withTimeout(p,ms,fb){return new Promise(function(res){var done=false,t=setTimeout(function(){if(!done){done=true;res(fb)}},ms);Promise.resolve(p).then(function(v){if(!done){done=true;clearTimeout(t);res(v)}},function(){if(!done){done=true;clearTimeout(t);res(fb)}})})}
var TIMED_OUT={timedOut:true};
async function boot(){
  S.t0=Date.now();S.step='checking who you are';S.bootErr=null;S.dbState='init';S.loaded={};S.errs={};
  clearTimeout(S.gateTimer);S.gateTimer=setTimeout(function(){schedule()},12500);
  var th=lsGet('desk-theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);
  route();
  if(!window.claude||!window.claude.use){S.dbState='none';renderAll();return}
  try{
    S.step='the viewer record';
    var user=await withTimeout(window.claude.use('user'),4000,null);
    if(user){
      /* no email call: the declared scope is profile only, and on some viewers an email request never settles */
      var me=await withTimeout(user.me(),4000,TIMED_OUT);
      if(me===TIMED_OUT||!me)me={};
      var ow=await withTimeout(user.isOwner?user.isOwner():false,4000,false);
      var uid=me.id||null;if(!uid&&user.id)uid=await withTimeout(user.id(),4000,null);
      S.viewer={email:((me.email||'')+'').toLowerCase()||null,name:me.name||'',owner:!!ow,id:uid};
    }else S.viewer={email:null,name:''};
    S.step='file saving';
    var dl=await withTimeout(window.claude.use('downloads'),4000,null);window.__downloads=dl||null;
    S.step='the database';
    var db=await withTimeout(window.claude.use('db'),4000,null);
    if(!db){S.dbState='none';renderAll();return}
    S.db=db;S.dbState='ready';S.step='the users list';
    subscribe('users',db.collection('users'),function(d){S.users=d});
    subscribe('plants',db.collection('plants'),function(d){S.plants=d});
    subscribe('periods',db.collection('periods'),function(d){S.periods={};d.forEach(function(x){S.periods[x._id]=x})});
    subscribe('cells',db.collection('cells'),function(d){S.cells={};d.forEach(function(x){S.cells[x._id]=x});S.cellsSigTick=(S.cellsSigTick||0)+1});
    subscribe('mappings',db.collection('mappings'),function(d){S.mappings={};d.forEach(function(x){S.mappings[x._id]=x})});
    subscribe('uploads',db.collection('uploads').orderBy('at','desc').limit(200),function(d){S.uploads=d});
    subscribe('transfers',db.collection('transfers'),function(d){S.transfers=d});
    subscribe('potential',db.collection('potential'),function(d){S.potential=d;S.potVer++;DS.cache={}});
    subscribe('planlocks',db.collection('planlocks'),function(d){S.planlocks={};d.forEach(function(x){S.planlocks[x._id]=x})});
    subscribe('audit',db.collection('audit'),function(d){S.audit=d});
    subscribe('actions',db.collection('actions'),function(d){S.actions=d});
    subscribe('followups',db.collection('followups'),function(d){S.followups=d});
    subscribe('settings',db.collection('settings'),function(d){var m=d.find(function(x){return x._id==='main'});S.settings=m||null;applySettings(m);ingestAliases(d);DS.cache={}});
    subscribe('phasing',db.collection('phasing'),function(d){S.phasing=d;DS.cache={}});
    subscribe('roll',db.collection('roll'),function(d){S.rollDocs={};d.forEach(function(x){S.rollDocs[x._id]=x});S.rollLoaded=true;ingestRoll()});
    subscribe('receivables',db.collection('receivables'),function(d){S.recv=d});
    subscribe('collections',db.collection('collections'),function(d){S.coll=d});
    subscribe('stock',db.collection('stock'),function(d){S.stockRaw=d;ingestStock()});
    subscribe('itemmeta',db.collection('itemmeta'),function(d){S.itemMeta=d.find(function(x){return x._id==='main'})||null});
    subscribe('salesmaster',db.collection('salesmaster'),function(d){onSalesMaster(d.find(function(x){return x._id==='main'})||null)});
    setTimeout(function(){if(!S.smReady){S.smReady=true;ingestRoll()}},5000);
    renderAll();
  }catch(e){S.dbState='none';S.err=String(e&&e.message||e);renderAll()}
}
window.__desk={S:S,get U(){return U},fyOf:fyOf,qMonths:qMonths,gridQuarters:gridQuarters,ungz:ungz,parseCSV:parseCSV,groupOf:groupOf,parseDateCell:parseDateCell,sqftOf:sqftOf,covStatus:covStatus};
