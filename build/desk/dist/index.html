<script>
/* Synthetic invoice generator for the Virgo Lam Performance Desk.
 * Every value is invented. Nothing here is real Virgo data.
 * Used two ways: inlined into the page (Load demo data) and by make-test-files.mjs (test files).
 * Output is never committed (see .gitignore rules in .claude/rules/git.md). */
(function (root) {
  'use strict';

      for(var j=0;j<dp.length;j+=1){var p=dp[j];await dset('plants/'+p.plant_code,{plant_code:p.plant_code,plant_name:'',plant_type:p.plant_type,zone:'',state:'',b1_bpl_name:'',business:'laminates',active:true,seed:true})}
    }
  }catch(e){toast('Could not seed defaults: '+dbErrText(e))}
}

/* ================= coverage ================= */
function entityCells(ent){var o={};Object.keys(S.cells).forEach(function(k){var c=S.cells[k];if(c.entity===ent)o[c.ym]=c});return o}
function cellPlants(c){return c?Object.keys(c.plants||{}).length:0}
function covStatus(ent,qkey){
  var cs=entityCells(ent),ref=0;Object.keys(cs).forEach(function(ym){ref=Math.max(ref,cellPlants(cs[ym]))});
  var months=qMonths(qkey),present=0,ok=0,detail=[];
  months.forEach(function(ym){var n=cellPlants(cs[ym]);detail.push({ym:ym,plants:n});if(n>0)present++;if(n>0&&n>=Math.ceil(ref*0.9))ok++});
  var st=present===0?'miss':(ok===3?'ok':'part');
  return{st:st,detail:detail,ref:ref,closed:!!(S.periods[qkey]&&S.periods[qkey].status==='closed')};
}
function storageStats(){
  var docs=0,bytes=0,rows=0;
  Object.keys(S.cells).forEach(function(k){var c=S.cells[k];Object.keys(c.plants||{}).forEach(function(p){var x=c.plants[p];docs+=x.chunks||0;bytes+=x.bytes||0;rows+=x.lines||0})});
  return{docs:docs,bytes:bytes,lines:rows};
}

function headerIndex(headers){var m={};headers.forEach(function(h,i){var k=norm(h);if(k!==''&&!(k in m))m[k]=i});return m}

    if(d.type==='unknown'){U=newU();U.mode=mode;U.period=period;U.msg='The headers match no known file. Expected an invoice export from SAP B1 (docnum, CardCode, BPLName ...) or the S/4 sales register (Invoice Document Number, Plant ...).';renderUpload();return}

/* ---- dates ---- */
function serialToYMD(n){var d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
function parseDateCell(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){if(v>20000&&v<80000){var t=serialToYMD(v);t.kind='serial';return t}return null}
  if(v instanceof Date){return{y:v.getFullYear(),m:v.getMonth()+1,d:v.getDate(),kind:'serial'}}
  var s=String(v).trim(),m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return{y:+m[1],m:+m[2],d:+m[3],kind:'iso'};
  if((m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(s)))return{y:+m[3],m:+m[2],d:+m[1],kind:'text'};
  if(/^\d{5}(\.\d+)?$/.test(s)){var n=+s;if(n>20000&&n<80000){var t2=serialToYMD(n);t2.kind='serial';return t2}}
  return null;

    if(c==='ZABLAM'||c==='ZCRLAM'){var t=norm(tt).toUpperCase();if(t==='DOOR')return 'Door';if(t.indexOf('COMPACT')>=0)return 'Compact board';return 'Laminate'}
    return null;
  }

  if(c.indexOf('DECORATIVE LAMINATE')===0)return c.indexOf('DOOR')>=0?'Door':'Laminate';
  if(c.indexOf('PVC SHEET')===0)return 'PVC sheet';
  if(c.indexOf('COMPACT')>=0)return 'Compact board';
  return null;
}
function sqftOf(size,qty){
  var m=/^\s*(\d+(?:\.\d+)?)\s*[xX*]\s*(\d+(?:\.\d+)?)/.exec(String(size||''));if(!m)return null;

    if(closedTouched.length){await dset('log/'+uid,{at:nowISO(),by:by,event:'closed quarter reloaded',quarters:closedTouched,reason:U.reason||'',upload:uid,file:U.name})}
    outer:for(var yi=0;yi<yms.length;yi++){
      var ym=yms[yi],cellId='INV_'+ym;
      var cell=S.cells[cellId]?JSON.parse(JSON.stringify(S.cells[cellId])):{entity:'INV',ym:ym,plants:{}};cell.entity='INV';cell.ym=ym;if(!cell.plants)cell.plants={};
      var ps=byYm[ym];
      var stale=[];
      for(var pi=0;pi<ps.length;pi++){
        if(cancelFlag){stopped=true;break outer}
        var P=ps[pi];
        U.progressMsg='Writing '+ym+' plant '+P.plant+' ('+(done+1)+' of '+total+')';U.progress=Math.round(done/total*100);paintProgress();
        var chunks=await packChunks(sys,P);
        var old=cell.plants[P.plant],lines=0,docsN=P.docs.size,net=0,sheets=0,cb=0;
        P.agg.forEach(function(a){lines+=a[6];if(!a[4]){net+=a[9];sheets+=a[7]}});
        /* write chunks, 3 at a time */
        var q=chunks.slice();
        await Promise.all([0,1,2].map(async function(){while(q.length){var c=q.shift();await dset('inv/'+c.id,Object.assign({demo:demo||undefined,upload:uid},c.doc));cb+=c.doc.z.length;docsW++}}));
        if(old){for(var oi=chunks.length;oi<(old.chunks||0);oi++)stale.push('inv/'+(old.sys||sys)+'-'+P.plant+'-'+ym+'-'+oi);if(old.sys&&old.sys!==sys){for(var oj=0;oj<Math.min(old.chunks||0,chunks.length);oj++)stale.push('inv/'+old.sys+'-'+P.plant+'-'+ym+'-'+oj)}}
        var atNow=nowISO();
        cell.plants[P.plant]={sys:sys,chunks:chunks.length,docs:docsN,lines:lines,net:Math.round(net),sheets:sheets,bytes:cb,upload:uid,at:atNow,demo:demo||undefined};
        await writeRoll(P.plant,ym,sys,rollRowsOf(P.agg),atNow,demo);
        bytes+=cb;loadedLines+=lines;done++;
      }
      await dset('cells/'+cellId,cell);S.cells[cellId]=cell;
      for(var si=0;si<stale.length;si++)await ddel(stale[si]);
    }
  }catch(e){failed=e}
  /* close completed quarters */
  var closedNow=[];
  if(!failed&&U.mode==='historic'&&U.closeAfter&&!stopped){
    var n=istNow(),curKey=fyOf(n.y,n.m).key;
    for(var qk in r.quarters){
      var cs=covStatus('INV',qk);
      if(cs.st==='ok'&&qk<curKey&&(!S.periods[qk]||S.periods[qk].status!=='closed')&&qk!==curKey&&isPast(qk)){
        await dset('periods/'+qk,{fy_quarter:qk,status:'closed',closed_by:by,closed_at:nowISO(),demo:demo||undefined});S.periods[qk]={status:'closed'};closedNow.push(qk);
      }
    }
  }
  var status=failed?'Failed':(stopped||r.rejected?'Partial':'Loaded');
  if(failed)status='Failed';
  var upl={at:nowISO(),by:by,sys:sys,entity:'INV',file:U.name,size:U.size,mode:U.mode,periodLabel:U.period==='auto'?(Object.keys(r.quarters).length>1?'Auto: '+Object.keys(r.quarters).length+' quarters':Object.keys(r.quarters).map(qLabel).join(', ')):qLabel(U.period),
    read:r.read,loaded:failed?0:r.good,rejected:r.rejected,warned:r.warned,fanout:r.fanout,injection:r.injection,status:status,demo:demo||undefined,
    quarters:Object.keys(r.quarters),plantMonths:done,docsWritten:docsW,bytes:bytes,
    groups:r.groups,out_of_scope:r.other,internal_transfers:r.xfer,dateRepair:r.dateInfo.mixed?{swapped:r.dateInfo.swapped,min:r.minDate,max:r.maxDate}:null,
    mapping:Object.keys(U.map).reduce(function(o,k){o[k]=U.map[k]>=0?U.headers[U.map[k]]:null;return o},{}),closedQuarters:closedNow,reloadReason:closedTouched.length?U.reason:undefined,error:failed?dbErrText(failed):undefined};
  try{
    await dset('uploads/'+uid,upl);
    if(r.rejects.length){var rr=r.rejects.slice(0,1500);var rz=await gz(JSON.stringify(rr));await dset('rejects/'+uid,{z:rz,n:rr.length,total:r.rejected,demo:demo||undefined})}
    if(!failed){await dset('mappings/'+sys+'_invoice',{map:upl.mapping,sys:sys,entity:'INV',at:nowISO(),by:by})}
  }catch(e2){failed=failed||e2}
  U.stage='done';U.doneOk=!failed&&!stopped;
  U.doneMsg=failed?('Load stopped: '+dbErrText(failed)+' '+done+' of '+total+' plant-months were stored.'):stopped?('Stopped. '+done+' of '+total+' plant-months stored. Load the file again to finish; stored months are replaced, not duplicated.'):('Loaded '+fmtN(loadedLines)+' lines in '+done+' plant-months ('+fmtBytes(bytes)+', '+docsW+' documents).'+(closedNow.length?' Closed: '+closedNow.map(qLabel).join(', ')+'.':''));
  renderUpload();
}

function validateUser(u,isNew,ignoreId){

  if(isNew&&S.users.some(function(x){return x.email===u.email}))errs.push('Email already exists');
  if(!u.name)errs.push('Name is required');
  if(ROLES.indexOf(u.role)<0)errs.push('Role is not one of the 8 roles');
  if(!u.department)errs.push('Department is required');

  return errs;
}

/* ---- dates (all ISO strings, IST calendar) ---- */
function isoOf(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function parseISO(s){return new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)))}
function addDays(s,n){return new Date(parseISO(s).getTime()+n*86400000).toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((parseISO(a)-parseISO(b))/86400000)}
function dow(s){return parseISO(s).getUTCDay()}
function fmtDate(s){if(!s)return '';var d=parseISO(s);return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]+' '+d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+d.getUTCFullYear()}
function fmtShort(s){if(!s)return '';var d=parseISO(s);return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymLabel(ym){return MON[+ym.slice(5,7)-1]+' '+ym.slice(0,4)}
function realToday(){var n=istNow();return isoOf(n.y,n.m,n.d)}
function TODAY(){var t=lsGet('desk-today');return /^\d{4}-\d\d-\d\d$/.test(t||'')?t:realToday()}
function isWD(s){return dow(s)!==0&&!holidaySet()[s]}
function wdBetween(a,b){/* working days from a to b inclusive */var n=0;if(b<a)return 0;for(var d=a;d<=b;d=addDays(d,1))if(isWD(d))n++;return n}
function WD(ym){var last=ym+'-'+pad(ymDays(ym));return Math.max(1,wdBetween(ym+'-01',last))}
function addWD(s,n){var d=s,k=0;while(k<n){d=addDays(d,1);if(isWD(d))k++}return d}
function shiftYm(ym,k){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function ymRange(a,b){var o=[],x=a;while(x<=b&&o.length<400){o.push(x);x=shiftYm(x,1)}return o}
/* the one comparison function: a period moves back by exactly three months. There is no twelve-month shift anywhere. */
function priorMonth(ym){return shiftYm(ym,CFG.month_compare==='previous_month'?-1:-3)}
function priorQuarterMonth(ym){return shiftYm(ym,-3)}
function curQuarterKey(){return qKeyOfYm(TODAY().slice(0,7))}
function closedQuarters(){var cur=curQuarterKey(),k=cur,l=[];for(var i=0;i<12;i++){k=prevQ(k);l.unshift(k)}return l}
function fyQuarters(fyq){/* quarters of the FY of key, up to key */var m=/^FY(\d\d)-Q(\d)$/.exec(fyq),o=[];for(var q=1;q<=+m[2];q++)o.push('FY'+m[1]+'-Q'+q);return o}

/* ---- window: months with the fraction of each month that counts ---- */
function walk(months,N){
  var rem=N,out=[];
  months.forEach(function(ym){
    var wd=WD(ym),f;
    if(rem===Infinity)f=1;else if(rem<=0)f=0;else if(rem>=wd){f=1;rem-=wd}else{f=rem/wd;rem=0}
    out.push({ym:ym,frac:f});
  });
  return out;
}
/* resolve the period control into current and previous windows. f: {mode,q,m,from,to} */
function resolvePeriod(f,today){
  today=today||TODAY();var tYm=today.slice(0,7),curQ=qKeyOfYm(tYm);var mode=f.mode||'QTD';
  var R={mode:mode,today:today,note:''};
  if(mode==='QTD'||mode==='YTD'){
    var q=f.q||curQ,months=qMonths(q),open=(q===curQ);
    var N=open?wdBetween(months[0]+'-01',today):(q>curQ?0:Infinity);
    R.q=q;R.qOpen=open;R.N=N;
    if(mode==='QTD'){
      R.label=qLabel(q)+(open?' to date':'');R.cur=walk(months,N);R.prior=walk(months.map(priorQuarterMonth),N);R.priorQ=prevQ(q);R.priorLabel=qLabel(R.priorQ)+(open?' (same working days)':'');
      R.wdN=open?N:null;R.wdTot=months.reduce(function(a,m){return a+WD(m)},0);R.pro=open;
    }else{
      var qs=fyQuarters(q);R.quarters=qs;R.label='YTD '+qLabel(q).split(' ')[1]+(open?' so far':'');
      var allM=[];qs.forEach(function(k){allM=allM.concat(qMonths(k))});R.cur=walk(allM,qs[qs.length-1]===curQ?wdBetween(allM[0]+'-01',today):Infinity);
      R.prior=null;R.priorLabel='none: YTD is shown quarter by quarter';R.pro=false;
      /* latest-quarter QoQ for the card */
      var lm=qMonths(q);R.latestQ=q;R.latestCur=walk(lm,N);R.latestPrior=walk(lm.map(priorQuarterMonth),N);
    }
  }else if(mode==='MTD'){
    var m=f.m||tYm,open2=(m===tYm),N2=open2?wdBetween(m+'-01',today):(m>tYm?0:Infinity);
    R.m=m;R.N=N2;R.label=ymLabel(m)+(open2?' to date':'');R.cur=walk([m],N2);R.prior=walk([priorMonth(m)],N2);
    R.priorLabel=ymLabel(priorMonth(m))+(open2?' (same working days)':'');R.pro=open2;R.wdN=open2?N2:null;R.wdTot=WD(m);R.q=qKeyOfYm(m);
    R.priorQ=qKeyOfYm(priorMonth(m));
  }else{
    var from=f.from||shiftYm(tYm,-1),to=f.to||tYm;if(to<from)to=from;var ms=ymRange(from,to);
    var open3=to>=tYm,N3=open3?wdBetween(ms[0]+'-01',today):Infinity;if(ms[0]>tYm)N3=0;
    R.from=from;R.to=to;R.N=N3;R.label=ymLabel(from)+(from===to?'':' to '+ymLabel(to))+(open3?' (to date)':'');R.cur=walk(ms,N3);R.prior=walk(ms.map(priorQuarterMonth),N3);
    R.priorLabel=ymLabel(priorQuarterMonth(from))+(from===to?'':' to '+ymLabel(priorQuarterMonth(to)));R.pro=open3;R.q=qKeyOfYm(to);R.wdTot=ms.reduce(function(a,m){return a+WD(m)},0);R.wdN=open3?N3:null;
  }
  R.curMonths=R.cur.filter(function(x){return x.frac>0}).map(function(x){return x.ym});
  R.priorMonths=R.prior?R.prior.map(function(x){return x.ym}):[];
  return R;
}

/* ---- QoQ ---- */
function qoqOf(A,P,ctx){
  ctx=ctx||{};
  if(ctx.incomplete)return {v:null,state:'incomplete',txt:'incomplete history'};
  if(P==null)return {v:null,state:'none',txt:'no prior quarter'};
  if(P<=0){if(A>0)return {v:null,state:'new',txt:'New, no prior quarter'};if(A===0&&P===0)return {v:null,state:'zero',txt:'—'};return {v:null,state:'na',txt:'n/a'}}
  return {v:(A-P)/P*100,state:'ok',txt:fmtPct(((A-P)/P)*100,true)};
}
function fmtPct(v,sign,d){if(v==null||isNaN(v))return '—';d=d==null?1:d;var s=(Math.abs(v)<0.05&&d===1?0:v).toFixed(d);if(sign&&v>0)s='+'+s;return s.replace('-','−')+'%'}
function fmtVarMoney(v){return (v>0?'+':v<0?'−':'')+fmtMoney(Math.abs(v))}

/* ---- trend, moving average, Stretch (target-model.md) ---- */
function trendStats(series){
  /* series: numbers (or null for a quarter not loaded), oldest first. QoQ uses consecutive loaded pairs. */
  var n=series.length,qoqs=[],qoqAt=new Array(n).fill(null),ma=new Array(n).fill(null);
  for(var i=1;i<n;i++){var a=series[i],p=series[i-1];if(a!=null&&p!=null&&p>0){var q=(a-p)/p*100;qoqs.push(q);qoqAt[i]=q}}
  for(i=3;i<n;i++){var ok=true,s=0;for(var j=i-3;j<=i;j++){if(series[j]==null){ok=false;break}s+=series[j]}if(ok)ma[i]=s/4}
  var avg=qoqs.length?qoqs.reduce(function(a,b){return a+b},0)/qoqs.length:null;
  var sx=0,sy=0,sxx=0,sxy=0,k=0;for(i=0;i<n;i++){if(series[i]!=null){var x=i+1,y=series[i];sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;k++}}
  var slope=null,icpt=null;if(k>=2){var den=k*sxx-sx*sx;if(den!==0){slope=(k*sxy-sx*sy)/den;icpt=(sy-slope*sx)/k}}
  var short=qoqs.length<CFG.min_pairs,dir='short';
  if(!short){dir=avg>CFG.trend_band_pct?'rising':avg<-CFG.trend_band_pct?'falling':'flat'}
  return {n:n,qoqs:qoqs,qoqAt:qoqAt,ma:ma,avg:avg,slope:slope,icpt:icpt,pairs:qoqs.length,short:short,dir:dir};
}
function stretchOf(target,lastActual,ts){
  if(target==null||lastActual==null||lastActual<=0||!ts||ts.short||ts.avg==null)return {state:'na',required:null,threshold:null};
  var required=(target/lastActual-1)*100;
  var thr=CFG.stretch_multiple*Math.max(ts.avg,CFG.stretch_floor_pct);
  return {state:required>thr?'stretch':'ok',required:required,threshold:thr,avg:ts.avg};
}
function arrow(dir){return dir==='rising'?'▲ rising':dir==='falling'?'▼ falling':dir==='flat'?'▬ flat':'history too short'}
function arrowShort(dir){return dir==='rising'?'▲':dir==='falling'?'▼':dir==='flat'?'▬':'—'}
function statusOf(ach,lowerBetter){

async function respond(id,kind,data){
  if(!guardWrite())return;
  var a=S.actions.find(function(x){return x.id===id});if(!a)return;var u=effUser();
  if(!canRespond(a,u)){toast('Only the owner or a manager can respond');return}
  var by=u.email,patch={},e={by:by,kind:kind,text:data.text||''};
  if(kind==='ack'){patch.status='Acknowledged';e.text=data.text||'Acknowledged.'}
  else if(kind==='update'){patch.status='In progress';e.eta=data.eta||'';if(data.eta)e.text=(data.text||'')+' (new ETA '+fmtDate(data.eta)+')'}
  else if(kind==='done'){patch.status='Done';patch.closure=data.text;patch.done_at=nowISO()}
  else if(kind==='help'){patch.need_help=true;e.text=data.text||'Needs help.'}
  else if(kind==='reassign_req'){patch.status='Reassign requested';patch.prev_status=a.status;e.text=data.text}
  else if(kind==='blocked'){patch.status='Blocked';patch.prev_status=a.status;patch.blocked_reason=data.text}
  else if(kind==='unblock'){patch.status=a.prev_status&&OPEN_ST.indexOf(a.prev_status)>=0&&a.prev_status!=='Reassign requested'?a.prev_status:'In progress';e.text=data.text||'Unblocked.'}
  await saveAction(threadAdd(a,e,patch));
}

function senderOf(a){
  if(a.assigner&&a.assigner.indexOf('Desk rule')!==0)return a.assigner;
  var c=a.plant?coordFor(a.plant):null;if(c)return c.email;var ow=uByEmail(a.owner),mg=ow&&ow.reports_to_email?uByEmail(ow.reports_to_email):null;return mg?mg.email:'*super';/* Q22 recommendation: plant Coordinator, else the owner's manager, else a Super admin */
}
function iAmSender(a,u){var s=senderOf(a);return s===u.email||(s==='*super'&&u.role==='Super admin')}
function ladderRecipients(a,step){
  var owner=uByEmail(a.owner);if(!owner)return null;
  var rep=owner.reports_to_email?uByEmail(owner.reports_to_email):null,hod=hodFor(a.department),mg=mgmtUsers();
  var l2=rep||hod||mg[0]||null;
  if(step==='Reminder'||step==='L1')return {to:owner,cc:[]};
  if(step==='L2')return {to:l2,cc:[owner]};
  var l3list=hod&&(!owner||hod.email!==owner.email)&&(!l2||hod.email!==l2.email)?[hod]:mg.filter(function(m){return m.email!==owner.email&&(!l2||m.email!==l2.email)});
  if(!l3list.length&&hod)l3list=[hod];if(!l3list.length)return {to:l2,cc:[owner]};
  var cc=[];if(rep&&rep.email!==l3list[0].email)cc.push(rep);cc.push(owner);l3list.slice(1).forEach(function(x){cc.push(x)});
  return {to:l3list[0],cc:cc};
}

 Reminder:{subj:'Reminder: {action_id} due {when}, {title}',body:'Hi {recipient},\n\nA reminder that {action_id} "{title}" is due {when}, {due_date}.\nNext step: {next_step}\nSource: {source_ref}\nValue at risk: {value_at_risk}\n\nPlease acknowledge or update it here: {link}\n\n{sender}',wa:'Reminder: {action_id} "{title}" is due {when} ({due_date}). Next step: {next_step}. Update here: {link}'},
 L1:{subj:'Overdue 1 day: {action_id}, {title}',body:'Hi {recipient},\n\n{action_id} "{title}" was due on {due_date} and is now {days_overdue} day(s) overdue.\nNext step: {next_step}\nSource: {source_ref}\nValue at risk: {value_at_risk}\nLast update: {last_update}\n\nPlease respond with an update and a new date, or mark it done with a closure note: {link}\n\n{sender}',wa:'{action_id} "{title}" is {days_overdue} day(s) overdue (was due {due_date}). Next step: {next_step}. Please update or close it here: {link}'},
 L2:{subj:'Overdue {days_overdue} days, for your attention: {action_id}, {title}',body:'Hi {recipient},\n\n{action_id} "{title}", owned by {owner}, was due on {due_date} and is {days_overdue} days overdue.\nNext step: {next_step}\nSource: {source_ref}\nValue at risk: {value_at_risk}\nLast update: {last_update}\nBlocked: {blocked}\n\nPlease speak with {owner} and help agree a date. Thread and responses: {link}\n\n{sender}',wa:'{action_id} "{title}" ({owner}) is {days_overdue} days overdue, due {due_date}. Next step: {next_step}. Please help move it: {link}'},
 L3:{subj:'Escalation, overdue {days_overdue} days: {action_id}, {title}',body:'Hi {recipient},\n\n{action_id} "{title}", owned by {owner} (reports to {reports_to}), was due on {due_date} and is {days_overdue} days overdue. It was reminded at 1 day and escalated to {reports_to} at 3 days.\nNext step: {next_step}\nSource: {source_ref}\nValue at risk: {value_at_risk}\nLast update: {last_update}\nBlocked: {blocked}\n\nYour decision is needed on whether to reassign, extend the date or close it. Thread, responses and log: {link}\n\n{sender}',wa:'Escalation: {action_id} "{title}" ({owner}) is {days_overdue} days overdue, due {due_date}. Reminded and escalated to {reports_to}. Please decide: reassign, extend or close. {link}'}

function fillTpl(t,v){
  /* a line holding a placeholder with no value is dropped whole; text from data is inserted as plain text */
  return t.split('\n').map(function(line){
    var drop=false;var out=line.replace(/\{(\w+)\}/g,function(m,k){var x=v[k];if(x==null||x===''){drop=true;return ''}return String(x)});
    return drop?null:out;
  }).filter(function(l){return l!==null}).join('\n');
}

    days_overdue:od>0?od:0,created_day:today,created_at:nowISO(),status:'Drafted',sender:senderOf(a),demo:a.demo||undefined};

async function runLadder(){
  var u=effUser();if(!u||readOnly()||S.ladBusy)return;
  if(!S.loaded.actions||!S.loaded.followups||!S.loaded.settings||!S.loaded.users)return;
  var today=TODAY(),sig=[today,S.actions.length,S.followups.length,S.actions.map(function(a){return a.status+a.due}).join('')].join('|');
  if(S.ladSig===sig)return;S.ladSig=sig;S.ladBusy=true;
  try{
    for(var i=0;i<S.actions.length;i++){
      var a=S.actions[i];if(LIVE_ST.indexOf(a.status)<0||!iAmSender(a,u))continue;
      var mine=S.followups.filter(function(f){return f.action_id===a.id&&f.due===a.due});
      if(mine.some(function(f){return f.created_day===today}))continue;/* one step per action per calendar day */
      var steps=[['Reminder',addDays(a.due,-CFG.remind_days_before)],['L1',addDays(a.due,CFG.L1_days)],['L2',addDays(a.due,CFG.L2_days)],['L3',addDays(a.due,CFG.L3_days)]];
      var next=null;
      for(var k=0;k<steps.length;k++){
        var st=steps[k];if(mine.some(function(f){return f.step===st[0]}))continue;
        if(st[0]==='Reminder'&&today>a.due)continue;/* due date has passed: no reminder */
        if(st[1]<=today){next=st[0];break}
        break;
      }
      if(!next)continue;
      var d=buildDraft(a,next,today);if(!d)continue;
      var ex=await dget('followups/'+d.id);if(ex.exists)continue;
      await dset('followups/'+d.id,d);
    }
  }catch(e){S.err=(S.err||'')+'ladder: '+dbErrText(e)+' '}
  S.ladBusy=false;
}
function afterData(){runEngine();runLadder()}

/* one row of figures for an entity: potential, target, actual, variance, achievement, share, last quarter, QoQ, trend */
function figs(ent,ctx,opts){
  opts=opts||{};
  var f=Object.assign({plants:ctx.plants},ctx.base,ent);if(f.sp===undefined&&ctx.sc.sp)f.sp=undefined;
  var res=ctx.res,cur=res.cur,pr=res.prior,spMode=f.sp!=null&&f.sp!==undefined&&ent.sp!==undefined||(ctx.sc.sp==null&&f.sp!=null);
  var A=sumF(f,cur),P=pr?sumF(f,pr):null;
  var pl=null;
  if(opts.noPlan){pl={any:false,tgt:0,pot:0,kind:'none',orig:0}}
  else if(f.sp!=null&&ent.sp!==undefined){pl=personPlan(f.sp,cur);pl.orig=pl.tgt}
  else if(f.sp!=null){pl=personPlan(f.sp,cur);pl.orig=pl.tgt}
  else pl=planW(f,cur);
  var pset=f.plant?new Set([f.plant]):f.plants;
  var incomplete=!monthsLoaded(res.curMonths,pset)||(res.prior?!monthsLoaded(res.priorMonths,pset):false);
  if(!res.curMonths.length)incomplete=true;
  var q=res.prior?qoqOf(A.n,P.n,{incomplete:incomplete}):{v:null,state:'none',txt:''};
  var hasT=pl.any&&pl.tgt>0;
  var o={A:A.n,sq:A.sq,docs:A.d,sh:A.sh,P:P?P.n:null,Psq:P?P.sq:null,pot:pl.any?pl.pot:null,tgt:hasT?pl.tgt:null,orig:hasT?pl.orig:null,kind:pl.kind,qoq:q,incomplete:incomplete};
  o.var=hasT?A.n-pl.tgt:null;o.varPct=hasT?(A.n-pl.tgt)/pl.tgt*100:null;o.ach=hasT?A.n/pl.tgt*100:null;o.share=(pl.any&&pl.pot>0)?A.n/pl.pot*100:null;
  if(!opts.noTrend){var ser=quarterSeries(f,(f.sp!=null)?f.sp:undefined);var ts=trendStats(ser.map(function(x){return x.isCur?null:x.A}));o.trend=ts;o.series=ser}
  return o;
}
function fmtAch(v,lower){if(v==null)return '<span class="note">—</span>';var st=statusOf(v,lower);return '<b class="a-'+st+'">'+v.toFixed(1)+'%</b>'}
function qoqCell(q){
  if(!q||q.state==='none')return '<span class="note">—</span>';
  if(q.state==='ok')return '<span class="'+(q.v>=0?'up':'dn')+'">'+fmtPct(q.v,true)+'</span>';
  if(q.state==='incomplete')return '<span class="note" title="Prior or current quarter is not fully loaded">incomplete history</span>';
  if(q.state==='new')return '<span class="note">New, no prior quarter</span>';
  return '<span class="note">'+esc(q.txt)+'</span>';
}
function trendCell(o){return o.trend?'<span class="'+(o.trend.dir==='rising'?'up':o.trend.dir==='falling'?'dn':'')+'" title="'+esc(arrow(o.trend.dir))+'">'+arrowShort(o.trend.dir)+'</span>':'—'}
function tgtCell(o){
  if(o.tgt==null)return '<span class="pill mute">No plan</span>';
  return fmtMoney(o.tgt)+(o.kind==='draft'?' <span class="pill part">Draft</span>':'')+(o.orig!=null&&Math.abs(o.orig-o.tgt)>1?'<div class="note">orig '+fmtMoney(o.orig)+'</div>':'');

/* standard table of §4: Potential · Target · Actual · Var · Ach % · Share % · Last Qtr · QoQ % · Trend, total row */
function stdTable(first,rows,tot,opt){

  var head='<tr><th>'+esc(first)+'</th>'+(opt.noPlan?'':'<th class="num">Potential</th><th class="num">Target</th>')+'<th class="num">Actual</th>'+(opt.noPlan?'':'<th class="num">Var</th><th class="num">Ach %</th><th class="num">Share %</th>')+'<th class="num">Last Qtr</th><th class="num">QoQ %</th><th>Trend</th></tr>';
  var line=function(label,o,total,attrs){
    return '<tr'+(total?' class="tot"':(attrs?' class="clk"':''))+(attrs||'')+'><td>'+label+'</td>'+(opt.noPlan?'':'<td class="num">'+(o.pot!=null?fmtMoney(o.pot):'—')+'</td><td class="num">'+tgtCell(o)+'</td>')
     +'<td class="num">'+fmtMoney(o.A)+'</td>'
     +(opt.noPlan?'':'<td class="num">'+(o.var!=null?'<span class="'+(o.var>=0?'up':'dn')+'">'+fmtVarMoney(o.var)+' · '+fmtPct(o.varPct,true)+'</span>':'—')+'</td><td class="num">'+fmtAch(o.ach)+'</td><td class="num">'+(o.share!=null?o.share.toFixed(1)+'%':'—')+'</td>')
     +'<td class="num">'+(o.P!=null?fmtMoney(o.P):'—')+'</td><td class="num">'+qoqCell(o.qoq)+'</td><td>'+trendCell(o)+'</td></tr>';
  };
  return '<div class="tw tall"><table class="std"><thead>'+head+'</thead><tbody>'+rows.map(function(r){return line(r.label,r.o,false,r.attrs)}).join('')+(tot?line('<b>Total</b>',tot,true):'')+'</tbody></table></div>';

function tableNote(ctx,extra){

function miniBars(vals,color){

  return '<svg class="mini" width="'+(vals.length*(w+g))+'" height="'+h+'" aria-hidden="true">'+vals.map(function(v,i){var bh=v==null?0:Math.max(2,v/mx*h);return '<rect x="'+i*(w+g)+'" y="'+(h-bh)+'" width="'+w+'" height="'+bh+'" rx="2" fill="'+(v==null?'var(--line)':'var(--'+color+')')+'" opacity="'+(i===vals.length-1?1:.55)+'"/>'}).join('')+'</svg>';

function runRate(ctx,o,fl){
  var r=ctx.res;if(r.mode!=='QTD'||!r.qOpen||o.tgt==null)return null;
  var ms=qMonths(r.q),tot=ms.reduce(function(a,m){return a+WD(m)},0),el=r.N,rem=Math.max(0,tot-el);
  var pl=planW(Object.assign({plants:ctx.plants},ctx.base,fl||{}),ms.map(function(m){return {ym:m,frac:1}}));
  var needTotal=pl.tgt;var need=rem>0?Math.max(0,(needTotal-o.A)/rem):0,now=el>0?o.A/el:0;return {need:need,now:now};
}
function salesKpis(ctx,o,series){
  var st=statusOf(o.ach),rr=runRate(ctx,o),mini=series?series.map(function(s){return s.A}):null;
  var shareChg='';

    var pf=Object.assign({plants:ctx.plants},ctx.base),pp=planW(pf,ctx.res.prior);
    if(pp.any&&pp.pot>0&&o.P!=null){var ps=o.P/pp.pot*100;shareChg=' ('+((o.share-ps)>=0?'+':'−')+Math.abs(o.share-ps).toFixed(1)+' pts vs last quarter)'}
    else shareChg=' (change greyed: no potential last quarter)';

}

/* ---- trend card: 12 closed quarters + current, target markers, QoQ line, MA4, trend line, Stretch ---- */
function trendCard(title,ent,ctx,personSp,id,opts){
  opts=opts||{};
  var f=Object.assign({plants:ctx.plants},ctx.base,ent||{});var sp=personSp!=null?personSp:(f.sp!=null?f.sp:undefined);
  var ser=opts.series||quarterSeries(f,sp),closed=ser.filter(function(s){return !s.isCur}),ts=trendStats(closed.map(function(s){return s.A})),cur=ser[ser.length-1];
  var all=ser.map(function(s){return s.A});
  if(!all.some(function(v){return v!=null&&v>0}))return '<section class="card"><div class="hd"><h2>'+esc(title)+'</h2></div><div class="empty">No quarters loaded in your scope yet. The trend needs history from Data Intake.</div></section>';
  var W=760,H=250,L=44,R=10,T=14,B=62,n=ser.length,bw=(W-L-R)/n,mx=Math.max.apply(null,all.map(function(v){return v||0}).concat(ser.map(function(s){return s.tgt||0})).concat([1]))*1.12;
  var y=function(v){return T+(H-T-B)*(1-v/mx)},x=function(i){return L+i*bw};
  var svg='<svg class="trend" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'. '+ser.map(function(s){return s.label+' '+(s.A==null?'not loaded':fmtMoney(s.A))}).join('; ')+'" preserveAspectRatio="xMidYMid meet"><defs><pattern id="hat'+id+'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--indigo)" opacity=".35"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--indigo)" stroke-width="3"/></pattern></defs>';
  for(var g=0;g<=4;g++){var gv2=mx/1.12*g/4,gy=y(gv2);svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(gy+3)+'" text-anchor="end" class="ax">'+esc(fmtMoney(gv2).replace('₹',''))+'</text>'}
  ser.forEach(function(s,i){
    var bx=x(i)+bw*.18,w=bw*.64;
    if(s.A==null){svg+='<rect x="'+bx+'" y="'+(T+4)+'" width="'+w+'" height="'+(H-T-B-4)+'" rx="4" fill="none" stroke="var(--ink3)" stroke-dasharray="4 3" opacity=".6"><title>'+s.label+': not loaded (gap, not zero)</title></rect>'}
    else svg+='<rect class="bar-q" data-act="trend-q" data-q="'+s.q+'" data-sp="'+esc(sp!=null?sp:'')+'" data-kind="'+(opts.kind||'sales')+'" data-pl="'+esc(f.plants?Array.from(f.plants).join(','):'')+'" x="'+bx+'" y="'+y(s.A)+'" width="'+w+'" height="'+Math.max(1,y(0)-y(s.A))+'" rx="4" fill="'+(s.isCur?'url(#hat'+id+')':'var(--indigo)')+'" stroke="var(--indigo)" tabindex="0"><title>'+s.label+' actual '+fmtMoney(s.A)+(s.tgt!=null?' · target '+fmtMoney(s.tgt):' · no plan')+'</title></rect>';
    if(s.tgt!=null)svg+='<line x1="'+(bx-3)+'" x2="'+(bx+w+3)+'" y1="'+y(s.tgt)+'" y2="'+y(s.tgt)+'" stroke="var(--orange)" stroke-width="2.5"><title>'+s.label+' target '+fmtMoney(s.tgt)+'</title></line>';
    svg+='<text x="'+(x(i)+bw/2)+'" y="'+(H-B+13)+'" text-anchor="middle" class="ax">'+esc(s.label.replace(' FY',' '))+(s.isCur?'*':'')+'</text>';
    svg+='<text x="'+(x(i)+bw/2)+'" y="'+(H-B+26)+'" text-anchor="middle" class="ax a-'+statusOf(s.ach)+'">'+(s.ach!=null?s.ach.toFixed(0)+'%':'—')+'</text>';
    var qv=i>0?ts.qoqAt[i]:null;if(s.isCur){var pv=ser[i-1].A;qv=(s.A!=null&&pv!=null&&pv>0&&cur.N!==Infinity)?null:qv}
    svg+='<text x="'+(x(i)+bw/2)+'" y="'+(H-B+40)+'" text-anchor="middle" class="ax '+(qv==null?'':qv>=0?'up':'dn')+'">'+(s.isCur?'QTD':(qv==null?'—':(qv>0?'+':'')+qv.toFixed(1).replace('-','−')))+'</text>';
  });
  /* previous-quarter marker on the current bar */
  var pv2=ser.length>1?ser[ser.length-2].A:null;if(pv2!=null)svg+='<line x1="'+(x(n-1)+bw*.1)+'" x2="'+(x(n-1)+bw*.9)+'" y1="'+y(pv2)+'" y2="'+y(pv2)+'" stroke="var(--ink)" stroke-dasharray="3 2" stroke-width="1.5"><title>Previous quarter '+fmtMoney(pv2)+'</title></line>';
  /* 4-quarter moving average (closed quarters) */
  var pts=ts.ma.map(function(v,i){return v==null?null:[x(i)+bw/2,y(v)]}).filter(Boolean);
  if(pts.length>1)svg+='<polyline points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'" fill="none" stroke="var(--violet)" stroke-width="2.2"><title>4-quarter moving average</title></polyline>';
  if(ts.slope!=null){var x1=1,x2=closed.length;svg+='<line x1="'+(x(0)+bw/2)+'" x2="'+(x(closed.length-1)+bw/2)+'" y1="'+y(ts.icpt+ts.slope*x1)+'" y2="'+y(ts.icpt+ts.slope*x2)+'" stroke="var(--green)" stroke-width="2" stroke-dasharray="6 4"><title>Trend line (least squares)</title></line>'}
  svg+='</svg>';
  /* Stretch / required QoQ against the current quarter's target */
  var lastClosed=closed[closed.length-1],req='';
  if(cur.tgt!=null&&lastClosed&&lastClosed.A!=null){var sr=stretchOf(cur.tgt,lastClosed.A,ts);
    req='<div class="callout '+(sr.state==='stretch'?'warn':'')+'">Target '+fmtMoney(cur.tgt)+' needs <b>'+fmtPct(sr.required,true)+'</b> QoQ'+(ts.avg!=null&&!ts.short?'; 12-qtr average is <b>'+fmtPct(ts.avg,true)+'</b>':'')+'. '+(sr.state==='stretch'?'<span class="pill part">Stretch</span> more than '+CFG.stretch_multiple+'× the average, flagged for discussion.':sr.state==='ok'?'Within '+CFG.stretch_multiple+'× the average.':'History too short for a Stretch check.')+'</div>'}
  var sumr='<div class="tsum"><div><small>Average QoQ growth ('+ts.pairs+' step'+(ts.pairs===1?'':'s')+', arithmetic)</small><b>'+(ts.avg!=null?fmtPct(ts.avg,true):'—')+'</b></div><div><small>Direction</small><b>'+(ts.short?'history too short':arrow(ts.dir))+'</b></div><div><small>Latest quarter</small><b>'+esc(cur.label)+(cur.N!==Infinity?' to date':'')+'</b></div></div>';
  var legend='<div class="legend"><span><i class="sw" style="background:var(--indigo)"></i>Actual (hatched = to date)</span><span><i class="sw" style="background:var(--orange)"></i>Target marker</span><span><i class="sw dash"></i>Previous quarter</span><span><i class="sw" style="background:var(--violet)"></i>4-quarter moving average</span><span><i class="sw" style="background:var(--green)"></i>Trend line</span></div>';
  return '<section class="card" id="trend-'+id+'"><div class="hd"><h2>'+esc(title)+'</h2><span class="note">12 closed quarters '+qLabel(closed[0].q)+' to '+qLabel(closed[closed.length-1].q)+' + '+esc(cur.label)+' to date</span></div>'
   +svg+'<div class="note">Under each bar: achievement % of that quarter\'s target, then QoQ % (each quarter against the one before; a gap breaks the chain). Tap a bar to drill: quarter → month → SAP document.</div>'+legend+sumr+req+'</section>';
}
function drillPanel(ctx){

  var q=d.q,ms=qMonths(q),f=Object.assign({plants:ctx.plants},ctx.base);if(d.sp)f.sp=d.sp;if(d.pl&&!d.sp)f.plants=new Set(d.pl.split(','));
  var rows=ms.map(function(m){var A=sumF(f,[m]),pm=priorMonth(m),P=sumF(f,[pm]),inc=!monthLoaded(m,ctx.plants)||!monthLoaded(pm,ctx.plants);var qo=qoqOf(A.n,P.n,{incomplete:inc});
    return '<tr class="clk" data-act="drill-m" data-m="'+m+'"><td>'+ymLabel(m)+' ›</td><td class="num">'+fmtMoney(A.n)+'</td><td class="num">'+fmtMoney(P.n)+' <span class="note">'+ymLabel(pm)+'</span></td><td class="num">'+qoqCell(qo)+'</td><td class="num">'+fmtN(A.d)+'</td></tr>'}).join('');
  var h='<section class="card" id="drillp"><div class="hd"><h2>Drill-down · '+qLabel(q)+(d.sp?' · '+esc(d.sp):'')+'</h2><button class="btn sm" data-act="drill-close">Close</button></div>'
   +'<div class="crumbs"><button class="chip" data-act="drill-close">Trend</button> › <button class="chip'+(d.m?'':' on')+'" data-act="drill-qonly">'+qLabel(q)+'</button>'+(d.m?' › <button class="chip" data-act="drill-m" data-m="'+d.m+'">'+ymLabel(d.m)+'</button> › <span class="chip on">SAP documents</span>':'')+'</div>'
   +'<div class="tw"><table><thead><tr><th>Month</th><th class="num">Actual</th><th class="num">Same position, previous quarter</th><th class="num">QoQ %</th><th class="num">Documents</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  if(d.m)h+=docList((d.pl&&!d.sp)?Object.assign({},ctx,{plants:f.plants}):ctx,d.m,null,null,d.sp||null);

/* documents: the last drill level. Index rows: [doc, day, customer, lines, sheets, net, transfer, sqft, salesperson] */

  var key=ym+'|'+(cust||'')+'|'+(plant||'')+'|'+(spF||'')+'|'+(ctx.plants?Array.from(ctx.plants).join(','):'');var st=S.docs&&S.docs.key===key?S.docs:null;
  if(!st){if(!S.docsLoading||S.docsLoading!==key){S.docsLoading=key;loadDocs(ctx,ym,cust,plant,key,spF)}return '<div class="note">Loading documents from the stored index...</div>'}

  if(st.noIndex)h+='<div class="banner warn">The document index was not kept for some of these plant-months (Data Intake option). Drill-down stops at the customer there.</div>';

  return h+'<p class="note">Drill-down stops at the SAP document (decision D9). Lines inside a document come from the SAP export. A document with two product groups appears once with its total.</p>';

async function loadDocs(ctx,ym,cust,plant,key,spF){
  var c=S.cells['INV_'+ym],sc=ctx.sc,rows=[],noIndex=false,legacy=false;
  if(c){
    var ps=Object.keys(c.plants||{}).filter(function(p){return plantInScope(sc,p)&&(!ctx.plants||ctx.plants.has(p))&&(!plant||p===plant)});
    for(var i=0;i<ps.length;i++){var info=c.plants[ps[i]];
      for(var k=0;k<(info.chunks||0);k++){
        var snap=await dget('inv/'+info.sys+'-'+ps[i]+'-'+ym+'-'+k);if(!snap.exists)continue;var o=JSON.parse(await ungz(snap.data().z));
        if(!snap.data().nh)noIndex=true;
        o.h.forEach(function(h){
          if(h[6])return;if(cust&&h[2]!==cust)return;
          if(sc.sp){if(h.length>8){if(!spOk(sc,h[8]))return}else legacy=true}
          if(spF&&h.length>8&&h[8]!==spF)return;
          rows.push({sys:info.sys,type:h[9]||'INV',doc:h[0],date:ym+'-'+pad(h[1]),plant:ps[i],cust:h[2],lines:h[3],sheets:h[4],net:h[5]});
        });
      }
    }
  }
  if(sc.sp&&legacy){/* old chunks: keep only documents of customers who have this person's aggregate rows */
    var mine={};custAgg({plants:ctx.plants},[ym]).forEach(function(v,k){mine[k]=1});if(Object.keys(mine).length)rows=rows.filter(function(r){return mine[r.cust]})}
  rows.sort(function(a,b){return b.net-a.net});var cut=rows.length>300;
  S.docs={key:key,rows:rows.slice(0,3000),cut:cut,noIndex:noIndex,legacy:legacy};S.docsLoading=null;S.lastHtml='';schedule();
}

    rows:[['Addressable','pending rules'],['Target','No plan (P6)'],['Var','—'],['Ach %','—'],['Share of potential','—'],['Run-rate need vs now','—'],['QoQ %','—'],['12-qtr trend','—']]}));

function matchSearch(r){var q=(S.f.search||'').toLowerCase();return !q||(r.label||'').replace(/<[^>]+>/g,' ').toLowerCase().indexOf(q)>=0}
function planSq(ctx){
  var f=Object.assign({plants:ctx.plants},ctx.base),w=ctx.res.cur,out={pot:0,tgt:0};
  wins(w).forEach(function(x){var q=qKeyOfYm(x.ym),P=planQ(f,q),qm=qMonths(q),idx=qm.indexOf(x.ym),wdq=qm.reduce(function(a,m){return a+WD(m)},0);if(!P.nLeaf)return;out.pot+=P.potSqft*(WD(x.ym)*x.frac)/wdq;out.tgt+=(P.tgt>0?P.tgtSq*(P.months[idx]/P.tgt):0)*x.frac});
  return out;
}
function branchChart(ctx){
  var res=ctx.res,ps=distinct('plant').filter(function(p){return plantInScope(ctx.sc,p)});
  var rows=ps.map(function(p){var o=figs({plant:p},ctx,{noTrend:true});return {p:p,o:o}}).sort(function(a,b){return b.o.A-a.o.A}).slice(0,12);
  if(!rows.length)return '';
  var mx=Math.max.apply(null,rows.map(function(r){return Math.max(r.o.A,r.o.tgt||0,r.o.P||0)}).concat([1]));

    var u2=effUser();if(u2&&!canPage(u2,S.tab))location.hash='#/today';

  }
});

async function boot(){

  route();
  if(!window.claude||!window.claude.use){S.dbState='none';renderAll();return}
  try{
    var user=await window.claude.use('user');

    else S.viewer={email:null,name:''};
    var dl=await window.claude.use('downloads');window.__downloads=dl||null;
    var db=await window.claude.use('db');
    if(!db){S.dbState='none';renderAll();return}
    S.db=db;S.dbState='ready';
    subscribe('users',db.collection('users'),function(d){S.users=d});
    subscribe('plants',db.collection('plants'),function(d){S.plants=d});
    subscribe('periods',db.collection('periods'),function(d){S.periods={};d.forEach(function(x){S.periods[x._id]=x})});
    subscribe('cells',db.collection('cells'),function(d){S.cells={};d.forEach(function(x){S.cells[x._id]=x})});
    subscribe('mappings',db.collection('mappings'),function(d){S.mappings={};d.forEach(function(x){S.mappings[x._id]=x})});
    subscribe('uploads',db.collection('uploads').orderBy('at','desc').limit(200),function(d){S.uploads=d});
    subscribe('transfers',db.collection('transfers'),function(d){S.transfers=d});
    subscribe('potential',db.collection('potential'),function(d){S.potential=d;S.potVer++;DS.cache={}});
    subscribe('actions',db.collection('actions'),function(d){S.actions=d});
    subscribe('followups',db.collection('followups'),function(d){S.followups=d});
    subscribe('settings',db.collection('settings'),function(d){var m=d.find(function(x){return x._id==='main'});S.settings=m||null;applySettings(m);DS.cache={}});
    subscribe('phasing',db.collection('phasing'),function(d){S.phasing=d;DS.cache={}});
    subscribe('roll',db.collection('roll'),function(d){S.rollDocs={};d.forEach(function(x){S.rollDocs[x._id]=x});S.rollLoaded=true;ingestRoll()});
    subscribe('orders',db.collection('orders'),function(d){S.orders=d});
    subscribe('deliveries',db.collection('deliveries'),function(d){S.deliv=d});
    subscribe('receivables',db.collection('receivables'),function(d){S.recv=d});
    subscribe('collections',db.collection('collections'),function(d){S.coll=d});
    subscribe('stock',db.collection('stock'),function(d){S.stock=d});
    renderAll();
  }catch(e){S.dbState='none';S.err=String(e&&e.message||e);renderAll()}
}
